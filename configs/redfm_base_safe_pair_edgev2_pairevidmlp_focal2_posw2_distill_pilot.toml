# Distillation plumbing pilot (no teacher data required).
# Uses the current best objective branch and enables non-zero teacher-loss weights
# so runtime paths are exercised; without teacher fields in rows, these terms are no-op.

[model]
vocab_size = 32000
max_sequence_length = 256
embedding_dimension = 512
number_of_heads = 8
number_of_layers = 8
num_entity_labels = 17
num_relations = 32

[model.dimensions]
time_dimension = 128
state_dimension = 512

[model.attention]
window_size = 24

[model.wave_gate]
min_frequency = 0.02
max_frequency = 6.0
default_time_step = 0.05

[model.regularization]
dropout_rate = 0.1

[model.ablation]
use_ffn = true
ffn_expansion = 1.333333
use_vector_gains = false
use_per_head_alpha = false
use_branch_projections = false

[parallelization]
use_parallel_scan = true
chunk_size = 64

[relation_extraction]
max_candidate_spans = 128
max_candidate_pairs = 96
max_span_width = 8
span_context_layers = 0
span_context_neighbor_radius = 1
span_context_topk = 4
biaffine_rank = 64
pair_neighbor_radius = 3
pair_proposer_mode = "edge_retrieval_v2"
pair_global_top_spans = 12
pair_router_dimension = 64
pair_router_buckets = 8
pair_router_topk = 6
pair_router_routes_per_span = 2
pair_router_score_scale = 0.5
edge_v2_semantic_topk = 12
edge_v2_reverse_topk = 8
edge_v2_global_reserve = 16
edge_v2_semantic_score_scale = 1.5
edge_v2_span_score_scale = 0.5
edge_v2_distance_penalty = 0.02
edge_v2_require_mutual = false
pair_overgenerate_factor = 4
pair_retrieval_dimension = 64
pair_distance_buckets = 16
pair_retrieval_loss_weight = 0.25
pair_evidence_dimension = 64
relation_decoder_mode = "pair_evidence_mlp"
mention_score_mode = "learned"
mention_score_learned_weight = 1.0

[training]
batch_size = 4
gradient_accumulation_steps = 1
learning_rate = 2e-4
min_learning_rate = 1e-6
warmup_steps = 1000
total_steps = 50000
gradient_clip = 1.0
weight_decay = 0.01
null_relation_weight = 0.25
relation_focal_gamma = 2.0
positive_relation_weight = 2.0
relation_logit_adjustment_tau = 0.0
teacher_entity_loss_weight = 0.2
teacher_relation_loss_weight = 0.4
teacher_confidence_loss_weight = 0.2
allow_missing_teacher_targets = true
seed = 42

[training.checkpoints]
eval_every = 250
log_every = 25
save_every = 250

[data]
train_path = "data/rebel/train.jsonl"
val_path = "data/rebel/validation.jsonl"
test_path = "data/rebel/test.jsonl"
max_len = 256

[hardware]
device = "gpu"
mixed_precision = true
num_workers = 4
