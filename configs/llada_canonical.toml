# Canonical LLaDA training config for scripts/train_llada_canonical.jl

[model]
vocab_size = 32000
max_sequence_length = 512
embedding_dimension = 512
number_of_heads = 8
number_of_layers = 12

[model.prime]
prime_subtoken_length = 4
prime_subtoken_base = 16

[model.dimensions]
time_dimension = 128
state_dimension = 512

[model.attention]
window_size = 64

[model.wave_gate]
min_frequency = 0.1
max_frequency = 10.0
default_time_step = 0.1

[generation]
default_num_steps = 20
default_temperature = 1.0

[training]
batch_size = 16
learning_rate = 1e-4
min_learning_rate = 1e-6
warmup_steps = 1000
total_steps = 50000
gradient_clip = 1.0
mask_schedule = "cosine"

[training.checkpoints]
eval_every = 500
log_every = 100
save_every = 1000

[data]
train_path = "data/train.txt"
val_path = "data/val.txt"
tokenizer_model = "ibm-granite/granite-4.0-micro"
