# Fast smoke-test for span-context depth with sentence-edge inputs active.

[model]
vocab_size = 32000
max_sequence_length = 128
embedding_dimension = 128
number_of_heads = 4
number_of_layers = 2
num_entity_labels = 17
num_relations = 32

[model.dimensions]
time_dimension = 32
state_dimension = 128

[model.attention]
window_size = 8

[model.wave_gate]
min_frequency = 0.02
max_frequency = 6.0
default_time_step = 0.05

[model.regularization]
dropout_rate = 0.1

[model.ablation]
use_ffn = true
ffn_expansion = 1.333333
use_vector_gains = false
use_per_head_alpha = false
use_branch_projections = false

[parallelization]
use_parallel_scan = true
chunk_size = 32

[relation_extraction]
max_candidate_spans = 24
max_candidate_pairs = 48
max_span_width = 8
span_context_layers = 1
span_context_neighbor_radius = 1
span_context_topk = 4
span_context_use_adjacent = true
span_context_use_sentence = true
span_context_use_semantic = true
biaffine_rank = 16
pair_neighbor_radius = 2

[training]
batch_size = 8
gradient_accumulation_steps = 1
learning_rate = 2e-4
min_learning_rate = 1e-6
warmup_steps = 50
total_steps = 200
gradient_clip = 1.0
weight_decay = 0.01
seed = 42

[training.checkpoints]
eval_every = 10
log_every = 1
save_every = 50

[data]
train_path = "data/rebel/train.jsonl"
val_path = "data/rebel/validation.jsonl"
test_path = "data/rebel/test.jsonl"
max_len = 128

[hardware]
device = "gpu"
mixed_precision = true
num_workers = 2
