# Safer continuation config for redfm_base resumes.
# Reduces per-microbatch memory pressure while keeping the same model and data.

[model]
vocab_size = 32000
max_sequence_length = 256
embedding_dimension = 512
number_of_heads = 8
number_of_layers = 8
num_entity_labels = 17
num_relations = 32

[model.dimensions]
time_dimension = 128
state_dimension = 512

[model.attention]
window_size = 24

[model.wave_gate]
min_frequency = 0.02
max_frequency = 6.0
default_time_step = 0.05

[model.regularization]
dropout_rate = 0.1

[model.ablation]
use_ffn = true
ffn_expansion = 1.333333
use_vector_gains = false
use_per_head_alpha = false
use_branch_projections = false

[parallelization]
use_parallel_scan = true
chunk_size = 64

[relation_extraction]
max_candidate_spans = 48
max_candidate_pairs = 96
max_span_width = 8
biaffine_rank = 64
pair_neighbor_radius = 3

[training]
batch_size = 4
gradient_accumulation_steps = 1
learning_rate = 2e-4
min_learning_rate = 1e-6
warmup_steps = 1000
total_steps = 50000
gradient_clip = 1.0
weight_decay = 0.01

[training.checkpoints]
eval_every = 250
log_every = 1
save_every = 1000

[data]
train_path = "data/rebel/train.jsonl"
val_path = "data/rebel/validation.jsonl"
test_path = "data/rebel/test.jsonl"
max_len = 256

[hardware]
device = "gpu"
mixed_precision = true
num_workers = 4
